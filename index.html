<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>나의 작은 기록장</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <a href="index.html" class="logo">MY ARCHIVE</a>
        <nav>
            <a href="#home">홈</a>
            <a href="#posts">일상</a>
            <a href="#gallery">사진</a>
            <a href="#video">영상</a>
            <a href="#about">소개</a>
        </nav>
    </header>

    <main>
        <section class="hero" id="home">
            <p class="label">MY PERSONAL BLOG</p>
            <h1>나의 작은 순간들을<br>기록하는 공간</h1>
            <p>사진과 영상, 그리고 오래 간직하고 싶은 이야기들.</p>
        </section>

        <section id="posts">
            <h2>최근 기록</h2>
            <p>나의 일상과 생각을 기록하는 공간이야.</p>
        </section>

        <section id="gallery">
            <h2>사진 갤러리</h2>
            <div class="gallery">
                <img src="images/photo1.jpg" alt="사진 1">
                <img src="images/photo2.jpg" alt="사진 2">
                <img src="images/photo3.jpg" alt="사진 3">
            </div>
        </section>

        <section id="video">
            <h2>영상 보관함</h2>
            <p>좋아하는 영상과 추억을 모아 두는 공간.</p>
        </section>

        <section id="about">
            <h2>ABOUT ME</h2>
            <p>나에 대한 이야기와 취향을 소개하는 공간이야.</p>
        </section>
    </main>

    <footer>
        © 2026 MY ARCHIVE
    </footer>

    <script src="script.js"></script>
</body>
</html>
